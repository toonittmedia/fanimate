[package]
name = "fanimate-app"
description = "The Fanimate desktop app: window, docking UI shell, canvas and timeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "fanimate"
path = "src/main.rs"

[dependencies]
fanimate-core.workspace = true
fanimate-fnm.workspace = true
fanimate-render.workspace = true
fanimate-editor.workspace = true
fanimate-export.workspace = true
fanimate-import.workspace = true
fanimate-oscodec.workspace = true
env_logger.workspace = true
log.workspace = true
pollster.workspace = true
raw-window-handle = "0.6"
wgpu.workspace = true
winit.workspace = true
image.workspace = true
cpal.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11", "persistence"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
# verifies the signature of downloaded updates
ed25519-compact = { version = "2.1", default-features = false }
# SVG icons only: no text, fonts or embedded images
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
hound.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
