[package]
name = "fanimate-export"
description = "Fanimate export: rendering a project to video, GIF or PNG frames, and the render queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fanimate-core.workspace = true
fanimate-fnm.workspace = true
fanimate-render.workspace = true
fanimate-oscodec.workspace = true
hound.workspace = true
image = { workspace = true, features = ["gif", "exr", "tiff"] }
# animated PNG (the png crate image already uses)
png = "0.18"
# AV1, pure Rust, and the MP4 it goes in: royalty-free video Fanimate
# writes with nothing else installed
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
muxide = "0.2.5"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
resvg = { version = "0.48", default-features = false }

[lints]
workspace = true
