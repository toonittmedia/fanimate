[package]
name = "fanimate-editor"
description = "Fanimate editing model: selection, commands, undo history, clipboard and keymaps. No UI toolkit code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fanimate-core.workspace = true
fanimate-fnm.workspace = true
fanimate-text.workspace = true
fanimate-import.workspace = true
serde.workspace = true
image.workspace = true
hound.workspace = true
symphonia.workspace = true
psd.workspace = true
usvg.workspace = true
serde_json.workspace = true

# the fonts installed on the computer (the browser build has none to read)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }

[lints]
workspace = true
