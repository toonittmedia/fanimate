[workspace]
resolver = "3"
members = [
    "crates/fanimate-core",
    "crates/fanimate-fnm",
    "crates/fanimate-editor",
    "crates/fanimate-render",
    "crates/fanimate-export",
    "crates/fanimate-import",
    "crates/fanimate-oscodec",
    "crates/fanimate-app",
    "crates/fanimate-cli",
    "crates/fanimate-web",
]
default-members = [
    "crates/fanimate-core",
    "crates/fanimate-fnm",
    "crates/fanimate-editor",
    "crates/fanimate-render",
    "crates/fanimate-export",
    "crates/fanimate-import",
    "crates/fanimate-oscodec",
    "crates/fanimate-app",
    "crates/fanimate-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/toonittmedia/fanimate"
homepage = "https://github.com/toonittmedia/fanimate"
authors = ["The Fanimate Contributors"]

[workspace.dependencies]
fanimate-core = { path = "crates/fanimate-core" }
fanimate-fnm = { path = "crates/fanimate-fnm" }
fanimate-render = { path = "crates/fanimate-render" }
fanimate-editor = { path = "crates/fanimate-editor" }
fanimate-export = { path = "crates/fanimate-export" }
fanimate-import = { path = "crates/fanimate-import" }
fanimate-oscodec = { path = "crates/fanimate-oscodec" }

bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
env_logger = "0.11"
i_overlay = { version = "9.0", default-features = false }
cpal = "0.18"
hound = "3.5"
# reads MP3, Ogg Vorbis, FLAC and AAC (MPL-2.0: used as a library, unmodified)
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "aac", "isomp4", "wav", "pcm"] }
lyon = "1.0"
psd = "0.3"
usvg = { version = "0.48", default-features = false }
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (wgpu, lyon) are slow unoptimised; our own code stays debuggable.
# Without debug info for them, a debug build takes a few GB less disk.
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
