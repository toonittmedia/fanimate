# Flatpak manifest. The release workflow builds a single-file bundle from
# the already-built release folder (packaging/linux/package.sh puts it at
# flatpak-src/), so the Flatpak holds exactly the binaries of the other
# Linux packages. Updates come through Flatpak, not Fanimate's updater.
app-id: io.github.toonittmedia.Fanimate
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: fanimate
# the Ubuntu 22.04 flatpak-builder runs appstream-compose, which newer SDKs
# no longer ship; the metainfo file is installed as it is
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # projects, pictures, sounds and renders live anywhere the user keeps them
  - --filesystem=home
modules:
  - name: fanimate
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/fanimate /app/bin
      - cp -r fanimate fanimate-cli rhubarb LICENSE-MIT LICENSE-APACHE /app/lib/fanimate/
      - ln -s /app/lib/fanimate/fanimate /app/bin/fanimate
      - ln -s /app/lib/fanimate/fanimate-cli /app/bin/fanimate-cli
      - install -Dm644 io.github.toonittmedia.Fanimate.desktop /app/share/applications/io.github.toonittmedia.Fanimate.desktop
      - install -Dm644 io.github.toonittmedia.Fanimate.metainfo.xml /app/share/metainfo/io.github.toonittmedia.Fanimate.metainfo.xml
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.toonittmedia.Fanimate.png
      - install -Dm644 io.github.toonittmedia.Fanimate.xml /app/share/mime/packages/io.github.toonittmedia.Fanimate.xml
      - install -Dm644 fnm-file-512.png /app/share/icons/hicolor/512x512/mimetypes/application-x-fanimate-project.png
    sources:
      - type: dir
        path: ../../flatpak-src
