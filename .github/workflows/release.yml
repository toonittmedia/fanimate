name: Release

# Runs only when a release tag is pushed (by `pnpm release`) or when started
# by hand from the Actions tab. Ordinary pushes do not run CI; `pnpm release`
# runs fmt, clippy and the tests locally before it tags.
#
# A tag push builds and tests on all three platforms, then publishes a
# GitHub release with the binaries attached. A manual run does the same builds but
# only keeps them as workflow artifacts, without touching releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing libraries and a software Vulkan driver
        # lavapipe lets the GPU render test run without a GPU
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libasound2-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # One test at a time: the GPU tests each open and close a device, and a
      # software driver (lavapipe, WARP) crashes the process now and then when
      # several do so in parallel threads. It also names the test that crashed.
      - run: cargo test --workspace -- --test-threads=1
      - name: Licences (no GPL or LGPL dependency)
        run: python3 scripts/licences.py --check
      - name: WebAssembly build (engine crates)
        run: cargo check -p fanimate-core -p fanimate-fnm -p fanimate-editor -p fanimate-render -p fanimate-import --target wasm32-unknown-unknown
      - name: Headless render smoke test
        run: |
          cargo run -q -p fanimate-cli -- sample benchmark bench.fnm
          cargo run -q -p fanimate-cli -- validate bench.fnm
          cargo run -q -p fanimate-cli -- render bench.fnm -o bench.png --frame 30 --width 640
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Brand tokens
        run: pip install pillow pymupdf && python brand/scripts/build_brand.py --check

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: .exe
          # 22.04 rather than ubuntu-latest: binaries built against a newer
          # glibc do not run on older, still-common distributions.
          - name: linux-x64
            os: ubuntu-22.04
            exe: ""
          - name: macos-arm64
            os: macos-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing libraries, a software Vulkan driver and FFmpeg
        # Fanimate does not ship FFmpeg (docs/legal/video-export.md); the
        # distribution's is installed here so the tests cover the formats a
        # user's FFmpeg adds. Windows and macOS test their system encoders.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libasound2-dev mesa-vulkan-drivers ffmpeg
      - name: Fetch Rhubarb Lip Sync
        shell: bash
        run: |
          case "$RUNNER_OS" in Windows) p=windows ;; macOS) p=macos ;; *) p=linux ;; esac
          bash scripts/fetch-rhubarb.sh "$p" rhubarb-out
      - name: Test
        # One test at a time, as in Checks. On Windows the hosted runner's only
        # GPU is the WARP software renderer, so DirectX 12 is chosen outright:
        # Fanimate would otherwise also load OpenGL to look for a better one,
        # and that driver can crash the test process. The app keeps its own
        # choice (render backends); only this test run is pinned.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export WGPU_BACKEND=dx12; fi
          cargo test --workspace --release -- --test-threads=1
      - name: Build
        run: cargo build --release -p fanimate-app -p fanimate-cli
      - name: Headless render and benchmark
        # Shows that the renderer works on every platform and records the
        # numbers in the run summary. Hosted runners have no real GPU (a
        # software renderer or a virtual GPU), so the GPU figures are a smoke
        # test, not the performance budget; that is measured on the reference
        # laptops. A failure here is reported but does not stop the release.
        continue-on-error: true
        shell: bash
        run: |
          cli="target/release/fanimate-cli${{ matrix.exe }}"
          "$cli" sample benchmark bench.fnm
          "$cli" render bench.fnm -o "render-${{ matrix.name }}.png" --frame 30 --width 640
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            "$cli" bench --gpu
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the render for cross-platform comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.name }}
          path: render-${{ matrix.name }}.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="0.0.0-dev.${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dir="fanimate-${version}-${{ matrix.name }}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          mkdir -p "dist/$dir"
          cp "target/release/fanimate${{ matrix.exe }}" "target/release/fanimate-cli${{ matrix.exe }}" "dist/$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$dir/"
          # the program Fanimate runs for lip sync
          mkdir -p "dist/$dir/rhubarb"
          cp -R rhubarb-out/. "dist/$dir/rhubarb/"
          # a portable archive, as before, beside the installers
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
      # Installers. The self-updater installs the Windows installer, the
      # macOS .app.tar.gz and the AppImage (crates/fanimate-app/src/update.rs).
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q "/DAppVersion=${{ steps.package.outputs.version }}" "/DSourceDir=$PWD\dist\${{ steps.package.outputs.dir }}" "/DOutputDir=$PWD\dist" packaging\windows\fanimate.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS app and disk image
        if: runner.os == 'macOS'
        run: bash packaging/macos/package.sh "${{ steps.package.outputs.version }}" "dist/${{ steps.package.outputs.dir }}" dist arm64
      - name: AppImage and .deb
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh "${{ steps.package.outputs.version }}" "dist/${{ steps.package.outputs.dir }}" dist
      - name: Flatpak bundle
        if: runner.os == 'Linux'
        # a failure here is reported but does not stop the other packages
        continue-on-error: true
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --repo=flatpak-repo --force-clean flatpak-build \
            packaging/linux/io.github.toonittmedia.Fanimate.yml
          flatpak build-bundle flatpak-repo "dist/Fanimate-${{ steps.package.outputs.version }}-linux-x86_64.flatpak" \
            io.github.toonittmedia.Fanimate
      - uses: actions/upload-artifact@v4
        with:
          name: fanimate-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.flatpak
          retention-days: 30

  web:
    name: Build (web)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build for the browser (WebGPU)
        run: bash scripts/build-web.sh dist/web
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="0.0.0-dev.${GITHUB_SHA::7}"
          cd dist && zip -r "fanimate-$version-web.zip" web
      - uses: actions/upload-artifact@v4
        with:
          name: fanimate-web
          path: dist/*.zip
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [build, web]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # the packages only, not the comparison renders
          pattern: fanimate-*
          path: dist
          merge-multiple: true
      - name: Sign update files
        # the updater refuses files without a signature from this key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          pip install cryptography
          python scripts/sign-update.py dist/*-setup.exe dist/*.app.tar.gz dist/*.AppImage
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # 0.x versions are pre-releases until 1.0
          pre=""
          case "$tag" in v0.*) pre="--prerelease" ;; esac
          # written release notes when there are some, else GitHub's list
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then
            how=(--notes-file "$notes")
          else
            how=(--generate-notes)
          fi
          gh release create "$tag" dist/* \
            $pre \
            --title "Fanimate $tag" \
            "${how[@]}"
